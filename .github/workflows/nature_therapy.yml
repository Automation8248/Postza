name: Nature Therapy Auto Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-to-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Nature Therapy Automation
        env:
          NATURE_THERAPY_WEBHOOK: ${{ secrets.NATURE_THERAPY_WEBHOOK }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          FAILED_CHAT_ID: ${{ secrets.FAILED_CHAT_ID }}
        run: |
          cd "Nature Therapy"
          python automation.py

      - name: Commit and Push track.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Nature Therapy/track.json"
          git commit -m "Update Nature Therapy tracking [skip ci]" || echo "No changes to commit"
          git push
