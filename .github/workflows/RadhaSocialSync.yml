name: RadhaSocialSync Automation

on:
  schedule:
    - cron: '0 5 * * *' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  daily-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Automation Script
        env:
          # Yahan bhi RADHA_WEBHOOK_URL update kar diya gaya hai
          RADHA_WEBHOOK_URL: ${{ secrets.RADHA_WEBHOOK_URL }}
          TELEGRAM_TOKEN_SUCCESS: ${{ secrets.TELEGRAM_TOKEN_SUCCESS }}
          TELEGRAM_TOKEN_FAIL: ${{ secrets.TELEGRAM_TOKEN_FAIL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd RadhaSocialSync
          python main.py

      - name: Commit and Push history.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add RadhaSocialSync/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated history.json after successful post" && git push)
