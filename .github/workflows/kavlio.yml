name: Kavlio Webhook Automation

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  post-kavlio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Kavlio Automation
        env:
          KAVLIO_WEBHOOK: ${{ secrets.KAVLIO_WEBHOOK }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          FAILED_CHAT_ID: ${{ secrets.FAILED_CHAT_ID }}
        run: python Kavlio/main.py
        
      - name: Save track.json Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Kavlio/track.json
          git commit -m "Update Kavlio track.json 90-day cooling [skip ci]" || echo "No changes to commit"
          git push
