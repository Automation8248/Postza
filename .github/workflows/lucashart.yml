name: Lucas Webhook Video Automation

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python Automation
        env:
          LUCAS_WEBHOOK: ${{ secrets.LUCAS_WEBHOOK }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          FAILED_CHAT_ID: ${{ secrets.FAILED_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Commit & Push Changes (History, Quotes, Cleanups)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Add all modifications, new files, and DELETIONS
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: appended history, updated captions, cleaned 30-day old data" && git push)
