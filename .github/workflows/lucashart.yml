name: Lucas Webhook Video Automation

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python Automation
        env:
          LUCAS_WEBHOOK: ${{ secrets.LUCAS_WEBHOOK }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          FAILED_CHAT_ID: ${{ secrets.FAILED_CHAT_ID }}
        run: python "Lucas Hart/main.py"

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: processed video, cleaned up captions & 30-day old data" && git push)
