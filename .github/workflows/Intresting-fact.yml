name: Interesting Fact Video Automation

on:
  schedule:
    # UTC time. IST = UTC + 5:30  ->  9:00 AM, 3:00 PM, 9:00 PM IST
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write           # track.json commit + fallback raw link ke liye

concurrency:
  group: interesting-fact   # ek time par ek hi run (track.json conflict kam hoga)
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r "Intresting Fact/requirements.txt"

      - name: Run automation
        env:
          WEBHOOK_INTRESTING_FACT: ${{ secrets.WEBHOOK_INTRESTING_FACT }}
          FAILED_CHAT_ID: ${{ secrets.FAILED_CHAT_ID }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
        run: python -u "Intresting Fact/main.py"

      # Video 3 din tak Artifacts me rahegi, uske baad GitHub khud delete kar dega
      - name: Save video in Artifacts (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fact-video-${{ github.run_number }}
          path: "Intresting Fact/output/fact_video_*.mp4"
          retention-days: 3
          if-no-files-found: ignore

      # track.json commit (cooldown yaad rakhne ke liye)
      - name: Commit track.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"

          git add "Intresting Fact/track.json"
          # output/ me tracked file ho tabhi add -u chalao (warna pathspec error aata hai)
          if git ls-files "Intresting Fact/output" | grep -q .; then
            git add -u -- "Intresting Fact/output"
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "update track.json [skip ci]"

          # Agar beech me kisi ne repo me push kiya ho to conflict aata hai.
          # -X theirs = is run ki track.json (latest cooldown data) jeetegi. 3 baar retry.
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin "$BRANCH"; then
              git push origin "HEAD:$BRANCH" && exit 0
            else
              git rebase --abort || true
            fi
            echo "retry $i ..."
            sleep 5
          done
          echo "Push failed after 3 tries"
          exit 1

      # Python ke bahar ka fail (install/ffmpeg etc.) ho to bhi Telegram alert
      - name: Telegram alert (workflow level failure)
        if: failure()
        env:
          FAILED_CHAT_ID: ${{ secrets.FAILED_CHAT_ID }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
        run: |
          if [ -f "Intresting Fact/.failed_notified" ]; then
            echo "Alert already sent by script"; exit 0
          fi
          if [ -z "$TELEGRAM_FAILD_TOKEN" ] || [ -z "$FAILED_CHAT_ID" ]; then
            echo "Telegram secrets missing"; exit 0
          fi
          NAME=$(python3 -c "import json;print(json.load(open('Intresting Fact/config.json')).get('automation_name',''))" 2>/dev/null)
          SOCIAL=$(python3 -c "import json;print(json.load(open('Intresting Fact/config.json')).get('social_media_name',''))" 2>/dev/null)
          THREAD=$(python3 -c "import json;print(json.load(open('Intresting Fact/config.json')).get('telegram_thread_id',8))" 2>/dev/null)
          TEXT=$(printf "AUTOMATION FAILED\n\nAutomation: %s\nSocial media: %s\nRepo: %s\nRun: %s/%s/actions/runs/%s\n\nReason: workflow step failed (install/ffmpeg/commit). Logs check karo." "$NAME" "$SOCIAL" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_FAILD_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${FAILED_CHAT_ID}" \
            --data-urlencode "message_thread_id=${THREAD}" \
            --data-urlencode "text=${TEXT}" > /dev/null
